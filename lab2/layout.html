<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лабораторная № 2 — вариант 3</title>
  <link rel="stylesheet" href="layout.css">
</head>
<body>
  <main class="layout" aria-label="Адаптивный макет, вариант 3">
    <div class="header row">
      <div class="cell c10">#CD5C5C</div><div class="cell c11">#DC143C</div>
      <div class="cell c12">#8B0000</div><div class="cell c13">#FF0000</div>
    </div>
    <div class="pink row">
      <div class="pink-stack column"><div class="cell c20">#FFC0CB</div><div class="cell c21">#FF69B4</div></div>
      <div class="cell c22">#C71585</div>
    </div>
    <div class="green row">
      <div class="green-side column"><div class="cell c30">#ADFF2F</div><div class="cell c31">#00FF00</div></div>
      <div class="green-content row">
        <div class="green-middle wrap"><div class="cell c32">#32CD32</div><div class="cell c33">#00FA9A</div><div class="cell c34">#2E8B57</div></div>
        <div class="green-end wrap"><div class="cell c35">#006400</div><div class="cell c36">#9ACD32</div><div class="cell c37">#808000</div></div>
      </div>
    </div>
    <div class="orange row"><div class="cell c50">#FFA07A</div><div class="cell c51">#FF4500</div></div>
    <div class="brown row">
      <div class="cell c60">#BC8F8F</div><div class="cell c61">#F4A460</div>
      <div class="brown-end wrap"><div class="brown-top row"><div class="cell c62">#D2691E</div><div class="cell c63">#8B4513</div></div><div class="cell c64">#A52A2A</div></div>
    </div>
  </main>
</body>
</html>
